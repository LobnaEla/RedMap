# Enhanced Configuration file

# LLM provider configuration
llm:
  provider: "groq"  # Options: "groq", "openai", "openrouter"
  
  # Provider-specific configurations
  groq:
    base_url: "https://api.groq.com/openai/v1"
    model: "llama3-70b-8192"
    api_key_env: "GROQ_API_KEY"
  
  openai:
    base_url: "https://api.openai.com/v1"
    model: "gpt-4"
    api_key_env: "OPENAI_API_KEY"
  
  openrouter:
    base_url: "https://openrouter.ai/api/v1"
    model: "nvidia/llama-3.1-nemotron-ultra-253b-v1:free"
    api_key_env: "OPENROUTER_API_KEY"
    extra_headers:
      HTTP-Referer: ""  # Optional
      X-Title: ""  # Optional
  
  # Common settings
  temperature: 0.1
  max_retries: 3
  retry_delay: 1

chunking:
  window_size: 2 # Context window around IOCs

prompts:
  ioc_extraction: |
    prompts:
  ioc_extraction: |
    You are a cybersecurity analyst specializing in IOC extraction.
    Analyze the provided text and extract all Indicators of Compromise (IOCs).
    Return the results as a JSON array, where each object includes:
    {
      "ioc": "<indicator_value>",
      "type": "<indicator_type>"
    }

    Include, but do not limit to, the following types:
    - ipv4
    - ipv6
    - domain
    - url
    - email
    - file_path
    - filename
    - file_extension
    - process_name
    - registry_key
    - hash_md5
    - hash_sha1
    - hash_sha256
    - hash_sha512
    - email_subject
    - attachment_name
    - bitcoin_address
    - ethereum_address
    - wallet_id
    - mitre_technique_id
    - cve_id

    Normalize obfuscated indicators (e.g., hxxp → http, [.] → ., [@] → @).
    Do not include duplicates. Only extract IOCs explicitly mentioned in the text.
   

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "cti_processing.log"

output:
  save_to_file: true
  output_directory: "output"
  include_metadata: true
