services:
  weaviate:
    command:
      - --host
      - 0.0.0.0
      - --port
      - '5000'
      - --scheme
      - http
    image: semitechnologies/weaviate:1.32.0
    ports:
      - "5000:5000"
      - "50051:50051"
    restart: on-failure:0
    networks:
      - rag_shared_network
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'none'
      ENABLE_MODULES: ''
      CLUSTER_HOSTNAME: 'node1'
      WEAVIATE_URL: http://weaviate:5000

    volumes:
      - weaviate_data:/var/lib/weaviate

  # Optional: Weaviate dashboard (uncomment if needed)
  # weaviate-dashboard:
  #   image: semitechnologies/weaviate-dashboard:latest
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     WEAVIATE_URL: http://weaviate:8080
  #   depends_on:
  #     - weaviate

  rag_api:
    build:
      context: .  
    ports:
      - "8000:8000"
    networks:
      - rag_shared_network
    depends_on:
      - weaviate  

volumes:
  weaviate_data:
    driver: local

networks:
  rag_shared_network:
    external: true
