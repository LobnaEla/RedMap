
version: '3'
services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_db:/var/lib/postgresql/data

  airflow-webserver:
    depends_on:
      - postgres
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__FERNET_KEY: V4ECsRtC8oLSNcbVmA8x2kWfR6Pl_vS4wmKimN_UU5s=
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'True'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
    volumes:
    - ./dags:/opt/airflow/dags
    - ./cti_pipeline:/opt/airflow/cti_pipeline
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8080:8080"
    command: webserver

  airflow-scheduler:
    depends_on:
      - airflow-webserver
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    volumes:
      - ./dags:/opt/airflow/dags
      - ./cti_pipeline:/opt/airflow/cti_pipeline
    build:
      context: .
      dockerfile: Dockerfile

    command: scheduler

volumes:
  postgres_db:
